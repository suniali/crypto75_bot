{% load static %}
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS // ACCESS TERMINAL</title>
    <script src="{% static 'vendor/js/tailwind.js' %}"></script>
    <style>
        @font-face {
            font-family: 'Vazirmatn';
            src: url('{% static "vendor/fonts/Vazirmatn-Regular.woff2" %}') format('woff2');
            font-weight: 400;
        }
        @font-face {
            font-family: 'Vazirmatn';
            src: url('{% static "vendor/fonts/Vazirmatn-Bold.woff2" %}') format('woff2');
            font-weight: 700;
        }
        body {
            font-family: 'Vazirmatn', sans-serif;
            background-color: #05050a;
            background-image: 
                linear-gradient(rgba(0, 243, 255, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 243, 255, 0.04) 1px, transparent 1px);
            background-size: 35px 35px;
        }
        /* برش گوشه‌های پنل به سبک سایبرپانک */
        .cyber-card {
            clip-path: polygon(
                0 20px, 20px 0, 
                100% 0, 100% calc(100% - 20px), 
                calc(100% - 20px) 100%, 0 100%
            );
        }
        .cyber-btn {
            clip-path: polygon(12px 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%, 0 12px);
        }
        .neon-cyan {
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.3), inset 0 0 10px rgba(0, 243, 255, 0.15);
        }
        .neon-pink-text {
            text-shadow: 0 0 8px rgba(255, 0, 128, 0.7);
        }
        .neon-cyan-text {
            text-shadow: 0 0 10px rgba(0, 243, 255, 0.8);
        }
    </style>
</head>
<body class="text-cyan-50 flex items-center justify-center min-h-screen relative overflow-hidden">

    <!-- هاله‌های نوری پس‌زمینه -->
    <div class="absolute -top-24 -right-24 w-96 h-96 bg-cyan-500/10 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute -bottom-24 -left-24 w-96 h-96 bg-fuchsia-600/10 rounded-full blur-3xl pointer-events-none"></div>

    <!-- قاب بیرونی با حاشیه نئونی -->
    <div class="w-full max-w-md p-[1px] bg-gradient-to-br from-cyan-400 via-fuchsia-500 to-cyan-400 cyber-card shadow-2xl mx-4">
        <div class="bg-[#0b0d17]/95 backdrop-blur-xl p-8 cyber-card relative">
            
            <!-- نوار وضعیت بالای ترمینال -->
            <div class="flex justify-between items-center text-[10px] tracking-widest text-cyan-400/70 font-mono mb-6 border-b border-cyan-500/20 pb-2">
                <span>SYS.STATUS // ONLINE</span>
                <span class="text-fuchsia-400 animate-pulse">● SECURE NODE</span>
            </div>

            <!-- لوگو و عنوان -->
            <div class="text-center mb-8">
                <h1 class="text-3xl font-extrabold tracking-wider text-cyan-400 neon-cyan-text font-mono">
                    JARVIS <span class="text-fuchsia-500 neon-pink-text">OS</span>
                </h1>
                <p class="text-xs text-gray-400 mt-2 tracking-wide">احراز هویت دسترسی به هسته معاملاتی</p>
            </div>

            <!-- نمایش خطا -->
            {% if form.errors %}
                <div class="mb-5 p-3 bg-fuchsia-950/60 border-r-4 border-fuchsia-500 text-fuchsia-200 text-xs flex items-center gap-2">
                    <span class="font-mono font-bold text-fuchsia-400">[ERR]</span>
                    <span>شناسه کاربری یا کد امنیتی نامعتبر است.</span>
                </div>
            {% endif %}

            <!-- فرم ورود -->
            <form method="post" class="space-y-5">
                {% csrf_token %}
                
                <div>
                    <label class="block text-xs font-semibold text-cyan-300 mb-2 tracking-wide">
                        شناسه اپراتور <span class="text-fuchsia-500 font-mono text-[10px]">// USER_ID</span>
                    </label>
                    <input type="text" name="username" required autocomplete="off"
                        class="w-full px-4 py-3 bg-[#06080f] border border-cyan-500/30 focus:border-cyan-400 focus:shadow-[0_0_12px_rgba(0,243,255,0.25)] rounded-none text-cyan-100 placeholder-gray-600 focus:outline-none transition duration-200 font-mono text-sm">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-cyan-300 mb-2 tracking-wide">
                        کلید رمزنگاری <span class="text-fuchsia-500 font-mono text-[10px]">// PASSCODE</span>
                    </label>
                    <input type="password" name="password" required
                        class="w-full px-4 py-3 bg-[#06080f] border border-cyan-500/30 focus:border-fuchsia-500 focus:shadow-[0_0_12px_rgba(255,0,128,0.25)] rounded-none text-cyan-100 placeholder-gray-600 focus:outline-none transition duration-200 font-mono text-sm">
                </div>

                <div class="pt-2">
                    <button type="submit" 
                        class="w-full py-3.5 bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-fuchsia-600 hover:to-cyan-500 text-gray-950 hover:text-white font-extrabold text-sm tracking-wider cyber-btn transition-all duration-300 shadow-[0_0_20px_rgba(0,243,255,0.4)] hover:shadow-[0_0_25px_rgba(255,0,128,0.6)] cursor-pointer">
                        اتصال به سیستم // INITIALIZE
                    </button>
                </div>
            </form>

            <!-- فوتر تزئینی -->
            <div class="mt-6 text-center text-[10px] font-mono text-gray-600">
                ENCRYPTED CONNECTION • MT5 CORE v1.2
            </div>
        </div>
    </div>

</body>
</html>
